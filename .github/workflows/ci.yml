name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Type check (mypy --strict)
        run: make typecheck
      - name: Tests (replay only, coverage gate 90%)
        run: make test
      - name: No secrets in committed cassettes
        run: make redact-check
      - name: Demo works with no API key
        run: make demo

  console:
    name: Console (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci
        working-directory: console-ui
      - run: npm test
        working-directory: console-ui
      - run: npm run typecheck
        working-directory: console-ui
      - run: npm run build
        working-directory: console-ui
      - name: Committed console build is up to date
        run: git diff --exit-code -- src/replex/console/static

  package:
    name: Wheel + Docker
    runs-on: ubuntu-latest
    needs: [test, console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Wheel ships the console
        run: python -m zipfile -l dist/*.whl | grep -q "replex/console/static/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Docker image builds and runs the CLI
        run: |
          docker build -t replex:ci .
          docker run --rm replex:ci --version
